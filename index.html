<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17182b">
    <title>NEXUS CRM | Business Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo"><div class="logo-icon">N</div><h2>NEXUS<span>.</span></h2></div>
        <p class="nav-label">MAIN MENU</p>
        <nav class="navigation">
            <button class="nav-item active" data-page="overview"><i data-lucide="layout-dashboard"></i><span>Overview</span></button>
            <button class="nav-item" data-page="customers"><i data-lucide="users"></i><span>Customers</span></button>
            <button class="nav-item" data-page="analytics"><i data-lucide="chart-no-axes-combined"></i><span>Analytics</span></button>
            <button class="nav-item" data-page="projects"><i data-lucide="folder-kanban"></i><span>Projects</span></button>
            <button class="nav-item" data-page="messages"><i data-lucide="message-square"></i><span>Messages</span></button>
        </nav>
        <p class="nav-label general-label">GENERAL</p>
        <nav><button class="nav-item" data-page="settings"><i data-lucide="settings"></i><span>Settings</span></button></nav>
        <div class="sidebar-bottom">
            <div class="upgrade"><h3>Upgrade to Pro</h3><p>Unlock more powerful business tools and analytics.</p><button id="upgradeBtn">Upgrade Now</button></div>
            <div class="sidebar-user"><div class="avatar">JD</div><div><strong>John Davis</strong><small>Administrator</small></div></div>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu icon-button" id="mobileMenu"><i data-lucide="menu"></i></button>
                <div><h1 id="pageTitle">Dashboard Overview</h1><p id="pageSubtitle">Welcome back! Here's what's happening today.</p></div>
            </div>
            <div class="top-actions">
                <button class="icon-button" id="themeBtn" title="Toggle theme"><i data-lucide="moon"></i></button>
                <button class="icon-button" id="notificationBtn" title="Notifications"><i data-lucide="bell"></i></button>
                <div class="top-profile"><div class="avatar">JD</div><div><strong>John Davis</strong><small>Administrator</small></div></div>
            </div>
        </header>
        <div id="pageContent"></div>
    </main>
</div>

<!-- Customer Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header"><h2 id="modalTitle">Add Customer</h2><button class="icon-button" id="closeModal" type="button"><i data-lucide="x"></i></button></div>
        <form id="customerForm">
            <input type="hidden" id="customerId">
            <label for="customerName">Full Name</label><input class="field-input" id="customerName" required placeholder="Enter customer name">
            <label for="customerEmail">Email Address</label><input class="field-input" id="customerEmail" type="email" required placeholder="name@email.com">
            <label for="customerCompany">Company</label><input class="field-input" id="customerCompany" required placeholder="Company name">
            <label for="customerStatus">Status</label>
            <select class="field-select" id="customerStatus"><option>Active</option><option>Pending</option><option>Inactive</option></select>
            <label for="customerRevenue">Revenue ($)</label><input class="field-input" id="customerRevenue" type="number" min="0" value="0">
            <div class="modal-actions"><button type="button" class="secondary-btn" id="cancelModal">Cancel</button><button type="submit" class="primary-btn">Save Customer</button></div>
        </form>
    </div>
</div>

<!-- Separate Project Modal -->
<div class="modal-overlay" id="projectModalOverlay">
    <div class="modal">
        <div class="modal-header"><h2 id="projectModalTitle">Add Project</h2><button class="icon-button" id="closeProjectModal" type="button"><i data-lucide="x"></i></button></div>
        <form id="projectForm">
            <input type="hidden" id="projectId">
            <label for="projectName">Project Name</label><input class="field-input" id="projectName" required maxlength="80" placeholder="Enter project name">
            <label for="projectDescription">Description</label><textarea class="field-input" id="projectDescription" rows="3" maxlength="300" placeholder="Describe the project"></textarea>
            <label for="projectProgress">Progress (%)</label><input class="field-input" id="projectProgress" type="number" min="0" max="100" value="0" required>
            <label for="projectStatus">Status</label>
            <select class="field-select" id="projectStatus"><option value="In Progress">In Progress</option><option value="Completed">Completed</option><option value="On Hold">On Hold</option></select>
            <div class="modal-actions"><button type="button" class="secondary-btn" id="cancelProjectModal">Cancel</button><button type="submit" class="primary-btn">Save Project</button></div>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
